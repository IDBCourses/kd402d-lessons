# Publishes main to the gh-pages branch, which GitHub Pages serves.
# Leaves pr-preview/ alone so open PR previews survive a deploy.
name: Deploy site

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency: deploy-site

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude .claude --exclude _site ./ _site/

      - uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
          clean-exclude: pr-preview
          force: false
